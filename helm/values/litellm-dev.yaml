# ============================================================================
# Helm values – LiteLLM Proxy dla środowiska dev (PoC)
# Chart: oci://ghcr.io/berriai/litellm-helm (v1.110.3+)
# ============================================================================

replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm
  tag: "main-latest"
  pullPolicy: IfNotPresent

# --- Master key (PoC) ---
masterkey: "sk-aigw-master-poc-dev"

# --- Log level ---
logLevel: INFO

# --- Proxy config (renderowany jako ConfigMap przez chart) ---
proxy_config:
  model_list:
    # Mock local backend – do testów bez kluczy API
    - model_name: "mock-local"
      litellm_params:
        model: "openai/mock-local"
        api_base: "http://mock-backend:8080/v1"
        api_key: "mock-key-not-used"
      model_info:
        metadata:
          zone: "local"
          provider: "mock"
          description: "Mock backend lokalny – do testów"

  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY

  litellm_settings:
    drop_params: true
    set_verbose: false
    num_retries: 2
    request_timeout: 30
    cache: false

# --- Postgres (subchart – standalone dla PoC) ---
db:
  deployStandalone: true

postgresql:
  architecture: standalone
  auth:
    username: litellm
    password: litellm-poc-password
    database: litellm
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

# --- Redis wyłączony (PoC) ---
redis:
  enabled: false

# --- Resources ---
resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# --- Service ---
service:
  type: ClusterIP
  port: 4000

# --- ServiceAccount z Workload Identity ---
serviceAccount:
  create: true
  name: litellm
  annotations: {}

# --- Probes ---
livenessProbe:
  path: /health/liveliness
  initialDelaySeconds: 30
  periodSeconds: 15

readinessProbe:
  path: /health/readiness
  initialDelaySeconds: 10
  periodSeconds: 10
