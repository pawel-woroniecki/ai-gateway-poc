# ============================================================================
# Helm values – LiteLLM Proxy dla środowiska dev (PoC)
# Chart: oci://ghcr.io/berriai/litellm-helm (v1.110.3+)
# ============================================================================

replicaCount: 1

# --- Deployment strategy ---
# Recreate zamiast RollingUpdate – na single-node (e2-standard-2)
# nie ma miejsca na 2 pody LiteLLM jednocześnie (każdy wymaga 4Gi RAM).
strategy:
  type: Recreate

image:
  repository: ghcr.io/berriai/litellm
  tag: "main-latest"
  pullPolicy: IfNotPresent

# --- Master key (PoC) ---
masterkey: "sk-aigw-master-poc-dev"

# --- UI credentials (wymagane od nowszych wersji LiteLLM) ---
envVars:
  UI_USERNAME: admin
  # Wymagane do auto-migracji Prisma przy starcie poda
  DATABASE_URL: "postgresql://litellm:litellm-poc-password@litellm-postgresql:5432/litellm"
  UI_PASSWORD: sk-aigw-master-poc-dev

# --- Log level ---
# UWAGA: logLevel celowo pominięty – chart v1.110.3 ma bug (duplikuje
# LITELLM_LOG env var gdy logLevel jest ustawiony). Domyślnie = INFO.

# --- Proxy config (renderowany jako ConfigMap przez chart) ---
proxy_config:
  model_list:
    # Mock local backend – do testów bez kluczy API
    - model_name: "mock-local"
      litellm_params:
        model: "openai/mock-local"
        api_base: "http://mock-backend:8080/v1"
        api_key: "mock-key-not-used"
      model_info:
        metadata:
          zone: "local"
          provider: "mock"
          description: "Mock backend lokalny – do testów"

  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY

  litellm_settings:
    drop_params: true
    set_verbose: false
    num_retries: 2
    request_timeout: 30
    cache: false

# --- Postgres (subchart – standalone dla PoC) ---
db:
  deployStandalone: true

postgresql:
  architecture: standalone
  auth:
    username: litellm
    password: litellm-poc-password
    database: litellm
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

# --- Redis wyłączony (PoC) ---
redis:
  enabled: false

# --- Resources ---
# Oficjalne minimum LiteLLM: 4Gi RAM / 1 CPU na worker (1 worker na pod).
# Ref: https://docs.litellm.ai/docs/proxy/prod
resources:
  requests:
    cpu: "1"
    memory: "4Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

# --- Service ---
# LoadBalancer zamiast ClusterIP – Cloud Shell Web Preview stripuje
# nagłówki Set-Cookie, co uniemożliwia logowanie do UI.
service:
  type: LoadBalancer
  port: 4000

# --- ServiceAccount z Workload Identity ---
serviceAccount:
  create: true
  name: litellm
  annotations: {}

# --- Probes ---
livenessProbe:
  path: /health/liveliness
  initialDelaySeconds: 30
  periodSeconds: 15

readinessProbe:
  path: /health/readiness
  initialDelaySeconds: 10
  periodSeconds: 10
